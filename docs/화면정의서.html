<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BiddingFlow 구매·입찰 자동화 플랫폼 화면정의서">
  <title>BiddingFlow 화면정의서</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080b12;
      --panel: #111723;
      --panel-soft: #171e2d;
      --line: #263147;
      --text: #f4f7fb;
      --muted: #9ca9bd;
      --accent: #f5b942;
      --accent-soft: rgba(245, 185, 66, 0.13);
      --blue: #70a5ff;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      background:
        radial-gradient(circle at 15% 0%, rgba(50, 80, 130, 0.20), transparent 34%),
        var(--bg);
      color: var(--text);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      overflow: hidden;
    }

    button, select { font: inherit; }

    .app { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; }

    .topbar {
      min-height: 64px;
      padding: 11px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: rgba(14, 19, 29, 0.94);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }

    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      color: #17120a;
      background: linear-gradient(145deg, #ffd36f, var(--accent));
      font-weight: 900;
    }
    .brand h1 { margin: 0; font-size: 16px; letter-spacing: -0.02em; }
    .brand p { margin: 3px 0 0; color: var(--muted); font-size: 11px; }

    .top-actions { display: flex; align-items: center; gap: 12px; }
    .screen-select {
      max-width: 290px;
      padding: 8px 34px 8px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-soft);
      color: var(--text);
      cursor: pointer;
    }
    .counter { min-width: 62px; color: var(--muted); font-size: 13px; text-align: right; }

    main { min-height: 0; padding: 16px; }

    .slide {
      display: none;
      grid-template-columns: minmax(0, 1.55fr) minmax(320px, 0.75fr);
      gap: 16px;
      height: 100%;
      animation: enter 180ms ease-out;
    }
    .slide.active { display: grid; }

    @keyframes enter {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .preview,
    .definition {
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.22);
    }

    .preview {
      display: grid;
      place-items: center;
      padding: 12px;
      overflow: auto;
      background:
        linear-gradient(45deg, rgba(255,255,255,.018) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(255,255,255,.018) 25%, transparent 25%),
        #0d121c;
      background-size: 24px 24px;
    }
    .preview img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 6px;
      background: #fff;
    }

    .definition { padding: 22px; overflow-y: auto; }
    .eyebrow { margin: 0 0 8px; color: var(--accent); font-size: 11px; font-weight: 800; letter-spacing: .12em; }
    .definition h2 { margin: 0; font-size: 25px; line-height: 1.25; letter-spacing: -.035em; }
    .purpose { margin: 12px 0 18px; color: var(--muted); font-size: 13px; line-height: 1.65; }
    .meta {
      display: grid;
      grid-template-columns: 86px 1fr;
      gap: 8px;
      margin-bottom: 22px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel-soft);
      font-size: 12px;
    }
    .meta-label { color: var(--muted); }
    .section-label { margin: 0 0 11px; color: var(--blue); font-size: 11px; font-weight: 800; letter-spacing: .1em; }
    .features { display: grid; gap: 9px; margin: 0; padding: 0; list-style: none; }
    .feature { display: grid; grid-template-columns: 24px 1fr; gap: 10px; align-items: start; }
    .feature-num {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      border-radius: 8px;
      background: var(--accent-soft);
      border: 1px solid rgba(245, 185, 66, .35);
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
    }
    .feature strong { display: block; margin-bottom: 3px; font-size: 13px; }
    .feature span { color: var(--muted); font-size: 12px; line-height: 1.55; }

    .bottom-nav {
      min-height: 64px;
      padding: 10px 22px;
      display: grid;
      grid-template-columns: 120px 1fr 120px;
      gap: 12px;
      align-items: center;
      background: rgba(14, 19, 29, 0.96);
      border-top: 1px solid var(--line);
    }
    .nav-btn {
      padding: 10px 15px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--panel-soft);
      color: var(--text);
      cursor: pointer;
      transition: border-color 160ms, background 160ms, transform 160ms;
    }
    .nav-btn:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); transform: translateY(-1px); }
    .nav-btn:disabled { opacity: .35; cursor: not-allowed; }
    .progress { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
    .dot {
      width: 8px;
      height: 8px;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: #344058;
      cursor: pointer;
      transition: width 160ms, background 160ms;
    }
    .dot.active { width: 24px; background: var(--accent); }
    .keyboard-hint { position: fixed; right: 18px; bottom: 74px; color: #657188; font-size: 10px; pointer-events: none; }

    @media (max-width: 900px) {
      body { overflow: auto; }
      .app { min-height: 100vh; height: auto; }
      .topbar { align-items: flex-start; }
      .top-actions { flex-direction: column; align-items: flex-end; }
      .screen-select { max-width: 180px; }
      main { min-height: 760px; }
      .slide, .slide.active { grid-template-columns: 1fr; grid-template-rows: minmax(320px, 52vh) auto; height: auto; }
      .definition { overflow: visible; }
      .bottom-nav { position: sticky; bottom: 0; grid-template-columns: 86px 1fr 86px; padding-inline: 10px; }
      .keyboard-hint { display: none; }
    }

    @media (max-width: 560px) {
      .brand p, .screen-select { display: none; }
      main { padding: 9px; }
      .definition { padding: 17px; }
      .definition h2 { font-size: 21px; }
      .bottom-nav { grid-template-columns: 78px 1fr 78px; }
      .nav-btn { padding-inline: 8px; font-size: 12px; }
      .dot { width: 6px; height: 6px; }
      .dot.active { width: 17px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">

        <div>

        </div>
      </div>
      <div class="top-actions">
        <select class="screen-select" id="screen-select" aria-label="화면 선택"></select>
        <span class="counter" id="counter" aria-live="polite"></span>
      </div>
    </header>

    <main id="slides" aria-label="BiddingFlow 화면 정의"></main>

    <nav class="bottom-nav" aria-label="화면 이동">
      <button class="nav-btn" id="prev" type="button">← 이전</button>
      <div class="progress" id="progress" aria-label="전체 화면 목록"></div>
      <button class="nav-btn" id="next" type="button">다음 →</button>

          ["판단 기록", "시각, 단계, 구매 건, 평가 대상, 점수와 모델을 제공합니다."],
          ["판단 근거", "AI가 결론을 내린 구체적인 근거를 확인합니다."],
          ["새로고침", "최신 판단 기록을 서버에서 다시 불러옵니다."]
        ]
      },
      {
        id: "BF-UI-08", name: "회사 구매 정책", user: "관리자",
        purpose: "구매 기준, 견적 평가 가중치, 자동화 수준과 AI 지침을 설정·게시합니다.",
        image: "../presentation/screens/BF-UI-08-company-policy.png",
        features: [
          ["모델 서버", "RunPod 워커 유지 시간, 준비 상태와 자동 해제를 관리합니다."],
          ["운영 설정", "품목 그룹 담당자, 이메일 허용 목록과 공급사 검색원을 관리합니다."],
          ["구매·평가 기준", "비딩 기준과 가격·납기·규격·평가 이력 가중치를 설정합니다."],
          ["자동 진행", "RFQ 자동 발송과 최종 선정 조건 및 안전 임계값을 설정합니다."],
          ["정책 게시", "AI 지침, 변경 사유, 검토와 버전별 복원을 관리합니다."]
        ]
      }
    ];

    const slidesRoot = document.getElementById("slides");
    const progressRoot = document.getElementById("progress");
    const select = document.getElementById("screen-select");
    const counter = document.getElementById("counter");
    const prev = document.getElementById("prev");
    const next = document.getElementById("next");
    let current = 0;

    screens.forEach((screen, index) => {
      const article = document.createElement("article");
      article.className = "slide";
      article.id = `slide-${index}`;
      article.innerHTML = `
        <section class="preview">
          <img src="${screen.image}" alt="${screen.id} ${screen.name} 화면 설계" loading="${index === 0 ? "eager" : "lazy"}">
        </section>
        <aside class="definition">
          <p class="eyebrow">${screen.id}</p>
          <h2>${screen.name}</h2>
          <p class="purpose">${screen.purpose}</p>
          <div class="meta">
            <span class="meta-label">주요 사용자</span><strong>${screen.user}</strong>
            <span class="meta-label">화면 유형</span><strong>${screen.id.includes("-") && screen.id.split("-").length > 3 ? "상세·모달" : "업무 화면"}</strong>
          </div>
          <p class="section-label">KEY FEATURES</p>
          <ol class="features">
            ${screen.features.map((feature, featureIndex) => `
              <li class="feature">
                <span class="feature-num">${featureIndex + 1}</span>
                <div><strong>${feature[0]}</strong><span>${feature[1]}</span></div>
              </li>`).join("")}
          </ol>
        </aside>`;
      slidesRoot.appendChild(article);

      const option = document.createElement("option");
      option.value = index;
      option.textContent = `${screen.id} · ${screen.name}`;
      select.appendChild(option);

      const dot = document.createElement("button");
      dot.type = "button";
      dot.className = "dot";
      dot.setAttribute("aria-label", `${screen.id} ${screen.name} 보기`);
      dot.addEventListener("click", () => show(index));
      progressRoot.appendChild(dot);
    });

    const slides = [...document.querySelectorAll(".slide")];
    const dots = [...document.querySelectorAll(".dot")];

    function show(index) {
      current = Math.max(0, Math.min(index, screens.length - 1));
      slides.forEach((slide, i) => slide.classList.toggle("active", i === current));
      dots.forEach((dot, i) => {
        dot.classList.toggle("active", i === current);
        dot.setAttribute("aria-current", i === current ? "true" : "false");
      });
      select.value = current;
      counter.textContent = `${current + 1} / ${screens.length}`;
      prev.disabled = current === 0;
      next.disabled = current === screens.length - 1;
      document.title = `${screens[current].id} ${screens[current].name} | BiddingFlow 화면정의서`;
    }

    prev.addEventListener("click", () => show(current - 1));
    next.addEventListener("click", () => show(current + 1));
    select.addEventListener("change", event => show(Number(event.target.value)));
    document.addEventListener("keydown", event => {
      if (event.key === "ArrowLeft") show(current - 1);
      if (event.key === "ArrowRight") show(current + 1);
      if (event.key === "Home") show(0);
      if (event.key === "End") show(screens.length - 1);
    });

    let touchStartX = null;
    document.addEventListener("touchstart", event => { touchStartX = event.changedTouches[0].clientX; }, { passive: true });
    document.addEventListener("touchend", event => {
      if (touchStartX === null) return;
      const delta = event.changedTouches[0].clientX - touchStartX;
      if (Math.abs(delta) > 60) show(current + (delta < 0 ? 1 : -1));
      touchStartX = null;
    }, { passive: true });

    show(0);
  </script>
</body>
</html>
