name: Backend CD

on:
  workflow_run:
    workflows: [Backend CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: biddingflow-production-backend
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://biddingflow.13.209.103.102.nip.io/

    steps:
      - name: Check out trusted deployment configuration
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve tested commit
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_SHA: ${{ github.sha }}
        run: |
          deploy_sha="${TESTED_SHA:-$MANUAL_SHA}"
          if [[ ! "$deploy_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid deployment SHA"
            exit 64
          fi
          echo "DEPLOY_SHA=$deploy_sha" >> "$GITHUB_ENV"

      - name: Configure restricted SSH identity
        env:
          DEPLOY_KEY: ${{ secrets.BIDDINGFLOW_DEPLOY_KEY }}
        run: |
          test -n "$DEPLOY_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/biddingflow_deploy"
          chmod 600 "$HOME/.ssh/biddingflow_deploy"

      - name: Trigger verified backend deployment
        run: |
          ssh \
            -i "$HOME/.ssh/biddingflow_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$GITHUB_WORKSPACE/deploy/ssh/known_hosts.production" \
            biddingflow-deploy@13.209.103.102 \
            "deploy backend $DEPLOY_SHA"
