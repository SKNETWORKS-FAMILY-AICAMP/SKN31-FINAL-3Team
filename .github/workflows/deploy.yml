name: Backend CD

on:
  workflow_run:
    workflows: [Backend CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: biddingflow-production-backend
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://biddingflow.13.209.103.102.nip.io/

    steps:
      - name: Resolve tested commit
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_SHA: ${{ github.sha }}
        run: |
          deploy_sha="${TESTED_SHA:-$MANUAL_SHA}"
          if [[ ! "$deploy_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid deployment SHA"
            exit 64
          fi
          echo "DEPLOY_SHA=$deploy_sha" >> "$GITHUB_ENV"

      - name: Trigger verified backend deployment
        env:
          DEPLOY_TOKEN: ${{ secrets.BIDDINGFLOW_DEPLOY_TOKEN }}
          DEPLOY_COMPONENT: backend
          TRIGGER_URL: https://biddingflow.13.209.103.102.nip.io/__biddingflow_deploy
        run: |
          test -n "$DEPLOY_TOKEN"
          payload="$(printf '{\"component\":\"%s\",\"commit_sha\":\"%s\"}' "$DEPLOY_COMPONENT" "$DEPLOY_SHA")"
          timestamp="$(date +%s)"
          signature="$(PAYLOAD="$payload" TIMESTAMP="$timestamp" python3 - <<'PY'
          import hashlib
          import hmac
          import os

          message = f"{os.environ['TIMESTAMP']}.{os.environ['PAYLOAD']}".encode()
          print(hmac.new(os.environ['DEPLOY_TOKEN'].encode(), message, hashlib.sha256).hexdigest())
          PY
          )"
          curl --fail --silent --show-error --connect-timeout 10 --max-time 20 \
            --request POST \
            --header "Content-Type: application/json" \
            --header "X-BiddingFlow-Timestamp: $timestamp" \
            --header "X-BiddingFlow-Signature: $signature" \
            --data-binary "$payload" \
            "$TRIGGER_URL"

      - name: Wait for backend deployment result
        env:
          DEPLOY_COMPONENT: backend
          STATUS_URL: https://biddingflow.13.209.103.102.nip.io/deployment-status.json
        run: |
          for attempt in $(seq 1 240); do
            status_json="$(curl --fail --silent --show-error "$STATUS_URL?ts=$(date +%s)")"
            result="$(jq -r '.result // empty' <<<"$status_json")"
            deployed_sha="$(jq -r --arg component "$DEPLOY_COMPONENT" '.[$component + "_commit"] // empty' <<<"$status_json")"
            requested_sha="$(jq -r '.requested_commit // empty' <<<"$status_json")"

            if [[ "$deployed_sha" == "$DEPLOY_SHA" && "$result" == "success" ]]; then
              echo "$DEPLOY_COMPONENT deployment succeeded: $DEPLOY_SHA"
              exit 0
            fi
            if [[ "$requested_sha" == "$DEPLOY_SHA" && "$result" == "failed" ]]; then
              echo "$status_json"
              exit 1
            fi
            sleep 5
          done

          echo "Timed out waiting for $DEPLOY_COMPONENT deployment: $DEPLOY_SHA"
          exit 1
